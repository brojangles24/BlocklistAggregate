name: Update Blocklist

on:
  schedule:
    # Runs at 02:00 UTC every day (Adjust as needed, but avoid hourly)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Upgraded for performance

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add blocklist.txt
          
          # Only commit if there are actual changes to avoid empty commits
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update blocklist: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
