name: Update Blocklist

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Add both the main list and the mobile list
          git add blocklist.txt mobile-blocklist.txt home-blocklist.txt minimal-blocklist.txt
          
          # Only commit if there are actual changes
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update blocklists: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
